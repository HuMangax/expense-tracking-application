; Production OPcache tuning for the FrankenPHP image.
; The container image is immutable — the app code never changes at runtime —
; so we disable timestamp validation (no per-request stat() calls) and give
; OPcache room plus JIT. This meaningfully cuts per-request CPU/latency.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Slightly larger realpath cache helps autoloading on a big vendor/ tree.
realpath_cache_size=4096K
realpath_cache_ttl=600
